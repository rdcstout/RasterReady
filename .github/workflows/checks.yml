name: Source and development bundle checks

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon-x11-0 libxcb-cursor0 g++ pkg-config patchelf desktop-file-utils
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Linux decoder-only HEIC build trial
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r requirements-heic-build.txt
          python tools/build_heic_linux.py ../heic-native --platform-tag manylinux_2_39_x86_64
          python -c "import pathlib, subprocess, sys; wheels = list(pathlib.Path('../heic-native/wheels').glob('*.whl')); assert len(wheels) == 1; subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', '--force-reinstall', str(wheels[0])], check=True)"
          python -m pip check
      - name: Windows decoder-only HEIC build trial
        if: runner.os == 'Windows'
        run: |
          python -m pip install -r requirements-heic-build.txt
          python tools/build_heic_windows.py ../heic-native
          python -c "import pathlib, subprocess, sys; wheels = list(pathlib.Path('../heic-native/wheels').glob('*.whl')); assert len(wheels) == 1; subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', '--force-reinstall', str(wheels[0])], check=True)"
          python -m pip check
      - name: Unit and component tests
        run: python -m pytest -q
      - name: Python style checks
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Compile owned Python sources
        run: python -m compileall -q rasterready tests tools build.py launcher.py
      - name: Python dependency advisory check
        run: python -m pip_audit --local
      - name: Build development bundle
        run: python build.py ${{ runner.os != 'macOS' && '--decoder-only-heic' || '' }}
      - name: Windows development installer trial
        if: runner.os == 'Windows'
        run: |
          python tools/fetch_nsis_windows.py ../nsis-tool
          $appVersion = python -c "from rasterready import __version__; print(__version__)"
          python tools/package_windows.py dist/RasterReady ../windows-installer --version $appVersion --makensis ../nsis-tool/nsis-3.13/makensis.exe --development
      - name: Linux development package trial
        if: runner.os == 'Linux'
        run: |
          python tools/linux_package_tools.py ../appimage-tools
          app_version=$(python -c "from rasterready import __version__; print(__version__)")
          python tools/package_linux.py dist/RasterReady ../linux-packages --version "$app_version" --development --tool-directory ../appimage-tools
      # Deliberately no binary uploads, release creation, tags, signing secrets
      # or deployment. Building does not establish packaged-app acceptance.
