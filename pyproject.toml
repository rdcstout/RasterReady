[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rasterready"
dynamic = ["version"]
description = "Prepare private, web-sized PNG images in a project folder."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["Pillow==13.0.0", "pillow-heif==1.8.1", "PySide6-Essentials==6.12.0", "rawpy==0.27.1", "numpy==2.5.4", "packaging==26.3"]

[tool.setuptools.dynamic]
version = {attr = "rasterready.__version__"}

[project.scripts]
rasterready = "rasterready.app:main"

[tool.setuptools.packages.find]
include = ["rasterready*"]

[tool.setuptools.package-data]
rasterready = ["assets/*.svg", "assets/*.txt", "assets/*.json", "assets/*.png", "assets/*.ico", "assets/*.icns"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
required-version = "==0.17.3"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
